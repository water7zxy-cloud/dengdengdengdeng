name: Deploy dengdeng to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v6.0.0
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://dengdengdengdeng.cc/
    steps:
      - name: Publish original domain
        uses: actions/deploy-pages@v5.0.1
