name: Package dengdeng release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Create versioned source and static packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${TAG}" >&2
            exit 1
          fi
          mkdir -p release
          git archive --format=zip --output="release/dengdeng-${TAG}-source.zip" HEAD
          (cd dist && zip -qr "${GITHUB_WORKSPACE}/release/dengdeng-${TAG}-static.zip" .)
          (cd release && shasum -a 256 *.zip > SHA256SUMS.txt)
          gh release create "${TAG}" --draft --target "${GITHUB_SHA}" --title "等灯 dengdeng ${TAG}" --notes-file RELEASE_NOTES.md
          gh release upload "${TAG}" release/*.zip release/SHA256SUMS.txt
