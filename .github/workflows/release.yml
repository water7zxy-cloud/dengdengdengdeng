name: Package dengdeng release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Create immutable source and static packages
        run: |
          mkdir -p release
          git archive --format=zip --output=release/dengdeng-v0.1.0-source.zip HEAD
          (cd dist && zip -qr ../release/dengdeng-v0.1.0-static.zip .)
          (cd release && sha256sum *.zip > SHA256SUMS.txt)
      - name: Attach packages to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.1.0 --target "$GITHUB_SHA" --notes-file RELEASE_NOTES.md --draft=true
          gh release upload v0.1.0 release/*.zip release/SHA256SUMS.txt --clobber
